---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present
    lock_timeout: 120

- name: Deploy static site (css, js, svg)
  ansible.builtin.copy:
    src: site/
    dest: /var/www/html/
    owner: www-data
    group: www-data
    mode: preserve
  notify: Reload nginx

- name: Deploy index.html from template
  ansible.builtin.template:
    src: index.html.j2
    dest: /var/www/html/index.html
    owner: www-data
    mode: "0644"
  notify: Reload nginx

- name: Enable and start nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true
    state: started
